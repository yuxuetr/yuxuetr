<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="yuxuetr (鱼雪) — Full-Stack, AI Engineering &amp; Rust Systems">
  <defs>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#0F141E"/>
    </linearGradient>
    <radialGradient id="glow-rust" cx="76%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-ai" cx="22%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="dot-grid-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E2E8F0" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="card-clip">
      <rect x="1" y="1" width="1198" height="278" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Base & ambient layers -->
    <rect x="0" y="0" width="1200" height="280" fill="url(#bg-dark)"/>
    <rect x="0" y="0" width="1200" height="280" fill="url(#dot-grid-dark)"/>
    <rect x="0" y="0" width="1200" height="280" fill="url(#glow-rust)"/>
    <rect x="0" y="0" width="1200" height="280" fill="url(#glow-ai)"/>

    <!-- Top accent hairline -->
    <rect x="0" y="0" width="1200" height="2.5" fill="url(#accent-line)"/>

    <!-- Left section: Identity -->
    <!-- Status pill -->
    <g transform="translate(56, 44)">
      <rect x="0" y="0" width="276" height="28" rx="14" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-opacity="0.32" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#10B981"/>
      <circle cx="16" cy="14" r="7" fill="#10B981" fill-opacity="0.22"/>
      <text x="30" y="18" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.8" fill="#6EE7B7">OPEN TO REMOTE &amp; CONSULTING</text>
    </g>

    <!-- Main title -->
    <text x="56" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.2" fill="#F8FAFC">yuxuetr<tspan dx="14" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="500" letter-spacing="0" fill="#94A3B8">/ 鱼雪</tspan></text>

    <!-- Subtitle -->
    <text x="58" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" letter-spacing="0.3" fill="#CBD5E1">Full-Stack  ·  AI Engineering  ·  Rust Systems</text>

    <!-- Domain tags -->
    <g transform="translate(56, 206)" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="500">
      <rect x="0" y="0" width="62" height="28" rx="6" fill="#F97316" fill-opacity="0.12" stroke="#F97316" stroke-opacity="0.35" stroke-width="1"/>
      <text x="31" y="18" text-anchor="middle" fill="#FDBA74">Rust</text>

      <rect x="72" y="0" width="118" height="28" rx="6" fill="#6366F1" fill-opacity="0.12" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1"/>
      <text x="131" y="18" text-anchor="middle" fill="#C7D2FE">LLM &amp; Agents</text>

      <rect x="200" y="0" width="102" height="28" rx="6" fill="#38BDF8" fill-opacity="0.10" stroke="#38BDF8" stroke-opacity="0.30" stroke-width="1"/>
      <text x="251" y="18" text-anchor="middle" fill="#BAE6FD">TypeScript</text>

      <rect x="312" y="0" width="76" height="28" rx="6" fill="#E2E8F0" fill-opacity="0.06" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="1"/>
      <text x="350" y="18" text-anchor="middle" fill="#CBD5E1">Python</text>

      <rect x="398" y="0" width="112" height="28" rx="6" fill="#E2E8F0" fill-opacity="0.06" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="1"/>
      <text x="454" y="18" text-anchor="middle" fill="#CBD5E1">WASM / Tauri</text>
    </g>

    <!-- Right section: Minimalist Rust Spec Card -->
    <g transform="translate(744, 42)">
      <rect x="0" y="0" width="400" height="196" rx="12" fill="#0B0F17" fill-opacity="0.88" stroke="#334155" stroke-opacity="0.65" stroke-width="1"/>
      <!-- Window header bar -->
      <line x1="0" y1="34" x2="400" y2="34" stroke="#1E293B" stroke-width="1"/>
      <circle cx="18" cy="17" r="4.5" fill="#475569"/>
      <circle cx="34" cy="17" r="4.5" fill="#475569"/>
      <circle cx="50" cy="17" r="4.5" fill="#475569"/>
      <text x="384" y="21" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#64748B">profile.rs</text>

      <!-- Code body -->
      <g font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13">
        <text x="20" y="62"><tspan fill="#FB923C">let</tspan><tspan fill="#E2E8F0" dx="7">yuxuetr</tspan><tspan fill="#94A3B8" dx="7">=</tspan><tspan fill="#38BDF8" dx="7">Engineer</tspan><tspan fill="#94A3B8" dx="7">{</tspan></text>
        <text x="36" y="86" fill="#94A3B8">role:</text>
        <text x="98" y="86"><tspan fill="#86EFAC">"Full-Stack &amp; AI"</tspan><tspan fill="#94A3B8">,</tspan></text>
        <text x="36" y="110" fill="#94A3B8">stack:</text>
        <text x="98" y="110"><tspan fill="#C4B5FD">["Rust", "TS", "Python"]</tspan><tspan fill="#94A3B8">,</tspan></text>
        <text x="36" y="134" fill="#94A3B8">mode:</text>
        <text x="98" y="134"><tspan fill="#38BDF8">WorkMode</tspan><tspan fill="#94A3B8">::</tspan><tspan fill="#FDBA74">Remote</tspan><tspan fill="#94A3B8">,</tspan></text>
        <text x="36" y="158" fill="#94A3B8">site:</text>
        <text x="98" y="158"><tspan fill="#86EFAC">"yuxuetr.com"</tspan><tspan fill="#94A3B8">,</tspan></text>
        <text x="20" y="180" fill="#94A3B8">};</text>
      </g>
    </g>
  </g>

  <!-- Outer hairline border -->
  <rect x="0.75" y="0.75" width="1198.5" height="278.5" rx="16" fill="none" stroke="#30363D" stroke-width="1.5"/>
</svg>
