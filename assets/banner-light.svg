<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="yuxuetr (鱼雪) — Full-Stack, AI Engineering &amp; Rust Systems">
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FAFAF9"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <radialGradient id="glow-rust-light" cx="78%" cy="25%" r="44%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-ai-light" cx="18%" cy="88%" r="40%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-line-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="dot-grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0F172A" fill-opacity="0.065"/>
    </pattern>
    <clipPath id="card-clip-light">
      <rect x="1" y="1" width="1198" height="278" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-light)">
    <!-- Base & ambient layers -->
    <rect x="0" y="0" width="1200" height="280" fill="url(#bg-light)"/>
    <rect x="0" y="0" width="1200" height="280" fill="url(#dot-grid-light)"/>
    <rect x="0" y="0" width="1200" height="280" fill="url(#glow-rust-light)"/>
    <rect x="0" y="0" width="1200" height="280" fill="url(#glow-ai-light)"/>

    <!-- Top accent hairline -->
    <rect x="0" y="0" width="1200" height="2.5" fill="url(#accent-line-light)"/>

    <!-- Left section: Identity -->
    <!-- Status pill -->
    <g transform="translate(56, 44)">
      <rect x="0" y="0" width="276" height="28" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#059669"/>
      <circle cx="16" cy="14" r="7" fill="#10B981" fill-opacity="0.22"/>
      <text x="30" y="18" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.8" fill="#047857">OPEN TO REMOTE &amp; CONSULTING</text>
    </g>

    <!-- Main title -->
    <text x="56" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.2" fill="#0F172A">yuxuetr<tspan dx="14" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="500" letter-spacing="0" fill="#64748B">/ 鱼雪</tspan></text>

    <!-- Subtitle -->
    <text x="58" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" letter-spacing="0.3" fill="#475569">Full-Stack  ·  AI Engineering  ·  Rust Systems</text>

    <!-- Domain tags -->
    <g transform="translate(56, 206)" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="500">
      <rect x="0" y="0" width="62" height="28" rx="6" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
      <text x="31" y="18" text-anchor="middle" fill="#C2410C">Rust</text>

      <rect x="72" y="0" width="118" height="28" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
      <text x="131" y="18" text-anchor="middle" fill="#4338CA">LLM &amp; Agents</text>

      <rect x="200" y="0" width="102" height="28" rx="6" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
      <text x="251" y="18" text-anchor="middle" fill="#0369A1">TypeScript</text>

      <rect x="312" y="0" width="76" height="28" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="350" y="18" text-anchor="middle" fill="#334155">Python</text>

      <rect x="398" y="0" width="112" height="28" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="454" y="18" text-anchor="middle" fill="#334155">WASM / Tauri</text>
    </g>

    <!-- Right section: Minimalist Rust Spec Card -->
    <g transform="translate(744, 42)">
      <rect x="0" y="0" width="400" height="196" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <!-- Window header bar -->
      <line x1="0" y1="34" x2="400" y2="34" stroke="#F1F5F9" stroke-width="1"/>
      <circle cx="18" cy="17" r="4.5" fill="#CBD5E1"/>
      <circle cx="34" cy="17" r="4.5" fill="#CBD5E1"/>
      <circle cx="50" cy="17" r="4.5" fill="#CBD5E1"/>
      <text x="384" y="21" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#94A3B8">profile.rs</text>

      <!-- Code body -->
      <g font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13">
        <text x="20" y="62"><tspan fill="#EA580C">let</tspan><tspan fill="#0F172A" dx="7">yuxuetr</tspan><tspan fill="#64748B" dx="7">=</tspan><tspan fill="#0284C7" dx="7">Engineer</tspan><tspan fill="#64748B" dx="7">{</tspan></text>
        <text x="36" y="86" fill="#64748B">role:</text>
        <text x="98" y="86"><tspan fill="#059669">"Full-Stack &amp; AI"</tspan><tspan fill="#64748B">,</tspan></text>
        <text x="36" y="110" fill="#64748B">stack:</text>
        <text x="98" y="110"><tspan fill="#4F46E5">["Rust", "TS", "Python"]</tspan><tspan fill="#64748B">,</tspan></text>
        <text x="36" y="134" fill="#64748B">mode:</text>
        <text x="98" y="134"><tspan fill="#0284C7">WorkMode</tspan><tspan fill="#64748B">::</tspan><tspan fill="#D97706">Remote</tspan><tspan fill="#64748B">,</tspan></text>
        <text x="36" y="158" fill="#64748B">site:</text>
        <text x="98" y="158"><tspan fill="#059669">"yuxuetr.com"</tspan><tspan fill="#64748B">,</tspan></text>
        <text x="20" y="180" fill="#64748B">};</text>
      </g>
    </g>
  </g>

  <!-- Outer hairline border -->
  <rect x="0.75" y="0.75" width="1198.5" height="278.5" rx="16" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
</svg>
